name: Tests

# Run the test suite on every push and pull request to the main branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match requires-python (>=3.11) in pyproject.toml.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install sibling dependencies (not on PyPI)
        # ocpy and correct_atmosphere are required imports but live in
        # separate ocean-colour repos rather than on PyPI, so install
        # them straight from GitHub before installing bing itself.
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/ocean-colour/ocpy.git
          pip install git+https://github.com/ocean-colour/correct-atmosphere.git

      - name: Install BING with dev extras
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest bing/tests/ -v
